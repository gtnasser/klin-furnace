; ============================================================
; platformio.ini - Configuracao do projeto
; Forno eletrico controlado por ESP32
; V1: simulacao no Wokwi
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; ------------------------------------------------------------
; Monitor serial
; ------------------------------------------------------------
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; ------------------------------------------------------------
; Flags de compilacao
; ------------------------------------------------------------
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall
    -Wextra
    -Wno-unused-parameter

; ------------------------------------------------------------
; Upload
; ------------------------------------------------------------
upload_speed = 921600

; ------------------------------------------------------------
; Debug (opcional, requer hardware)
; ------------------------------------------------------------
debug_tool = esp-prog
debug_init_break = tbreak setup

; ------------------------------------------------------------
; Wokwi (extensao do VS Code)
; ------------------------------------------------------------
; Requer a extensao "Wokwi for VS Code" instalada e a
; licenca gratuita ativada. O arquivo diagram.json deve
; estar na raiz do projeto.

